<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="../css/game.css">
</head>
<body>
    <div class="bg-glow"></div>

    <button type="button" class="back-link" id="btn-close">&larr; Close</button>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Score: <span id="hud-score">0</span></div>
            <div class="hud-chip">Best: <span id="hud-best">0</span></div>
            <button type="button" class="icon-btn" id="btn-restart" title="Restart">⟳</button>
        </div>

        <div class="board-wrap">
            <div class="board" id="board">
                <div class="board-bg" id="board-bg"></div>
                <div class="tiles" id="tiles"></div>
                <div class="overlay" id="overlay" hidden>
                    <div class="overlay__inner">
                        <div class="overlay__title" id="overlay-title">2048</div>
                        <div class="overlay__desc" id="overlay-desc">Merge matching tiles to reach 2048!</div>
                        <button type="button" class="overlay__btn" id="overlay-btn">Start</button>
                    </div>
                </div>
            </div>
        </div>

        <p class="hint">Use the arrow keys / WASD or swipe on the board to move</p>

        <div class="touch-controls" id="touch-controls">
            <button type="button" class="dpad-btn dpad-btn--up" data-dir="up" aria-label="Up">▲</button>
            <button type="button" class="dpad-btn dpad-btn--left" data-dir="left" aria-label="Left">◀</button>
            <button type="button" class="dpad-btn dpad-btn--down" data-dir="down" aria-label="Down">▼</button>
            <button type="button" class="dpad-btn dpad-btn--right" data-dir="right" aria-label="Right">▶</button>
        </div>

        <a class="coffee-badge" href="https://paypal.me/Newslette247" target="_blank" rel="noopener">
            <span class="emoji">☕</span> Enjoying the game? Buy me a coffee
        </a>
    </div>

    <div class="mini-contact">
        <a class="mini-contact__link" href="mailto:nguyenvantuan2391996@gmail.com" aria-label="Email" title="Email">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M2 4h20v16H2V4zm2 2.24V6l8 5.99L20 6v.24l-8 6-8-6zM20 18V8.51l-8 6-8-6V18h16z"/></svg>
        </a>
        <a class="mini-contact__link" href="https://www.linkedin.com/in/tuan-nguyen-van-555315156" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.5V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        </a>
        <a class="mini-contact__link" href="https://www.facebook.com/tuanelnino9/" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>
        </a>
    </div>

    <script src="../js/constants.js"></script>
    <script src="../js/game.js"></script>
</body>
</html>
