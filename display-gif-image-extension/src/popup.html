<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The extension supports for displaying the gif image when the website was loaded</title>
    <link rel="stylesheet" href="../css/popup.css">
</head>
<body>

<div class="container">
    <div class="header">
        <img src="../images/icon.png" alt="logo" class="header-icon">
        <div class="header-text">
            <h1>Gif Overlay</h1>
            <p>Configure your gif companion</p>
        </div>
    </div>

    <div id="alert-success" role="alert" class="alert hidden"></div>

    <div class="card">
        <div class="field">
            <label for="select-type">Gif source</label>
            <select id="select-type">
                <option id="type-random" value="type-random" selected>Random Gif</option>
                <option id="type-search-key" value="type-search-key">Search Gif By Key</option>
            </select>
        </div>

        <div class="field">
            <label for="input-key-search">Keyword</label>
            <input type="text" id="input-key-search" placeholder="e.g. cat cute" hidden>
            <p id="input-key-search-error" class="field-error hidden">Enter a keyword to search, or switch to Random Gif.</p>
        </div>

        <div class="field">
            <label for="select-position">Position</label>
            <select id="select-position">
                <option id="type-bottom-right" value="type-bottom-right" selected>Bottom Right</option>
                <option id="type-top-right" value="type-top-right">Top Right</option>
                <option id="type-bottom-left" value="type-bottom-left">Bottom Left</option>
                <option id="type-top-left" value="type-top-left">Top Left</option>
            </select>
        </div>

        <div class="field">
            <label for="range-size">Size <span id="size-value" class="field-value">180px</span></label>
            <input type="range" id="range-size" min="80" max="320" step="10" value="180">
        </div>

        <div class="field">
            <label for="range-speed">Speed <span id="speed-value" class="field-value">Medium</span></label>
            <input type="range" id="range-speed" min="10" max="60" step="5" value="30">
        </div>

        <div class="field">
            <div class="preview-header">
                <label class="preview-label">Preview</label>
                <button type="button" id="btn-preview" class="btn-link">Preview gif</button>
            </div>
            <div id="preview-box" class="preview-box hidden">
                <img id="preview-img" alt="Gif preview">
            </div>
        </div>
    </div>

    <div class="site-toggle">
        <span id="site-host" class="site-host"></span>
        <button type="button" id="btn-toggle-site" class="btn-link hidden">Disable on this site</button>
    </div>

    <div class="actions">
        <button type="button" id="btn-save-config" class="btn btn-primary">Save</button>
        <button type="button" id="btn-turn-on-off" class="btn btn-off">Off</button>
        <button type="button" id="btn-clear-config" class="btn btn-neutral">Clear</button>
    </div>
</div>

<script src="../js/constants.js"></script>
<script src="../js/apis.js"></script>
<script src="../js/popup.js"></script>
</body>
</html>
