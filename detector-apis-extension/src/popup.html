<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The extension supports for detector APIs of the website</title>
    <link rel="stylesheet" href="../css/popup.css">
</head>

<body>
<div class="app">
    <header class="app-header">
        <img src="../images/icon128.png" alt="Detector APIs Extension">
        <div class="titles">
            <h1>Detector APIs Extension</h1>
            <p>See every API call your browser makes</p>
        </div>
        <button type="button" class="open-tab-btn" id="open-tab-btn" title="Open in a full tab, so it stays open instead of closing when you click elsewhere">
            <span class="emoji">⧉</span> Open in Tab
        </button>
        <a class="coffee-badge" href="https://paypal.me/Newslette247" target="_blank" rel="noopener">
            <span class="emoji">☕</span> Buy me a coffee
        </a>
    </header>

    <div class="toast" id="alert-success"></div>

    <div class="toolbar">
        <div class="toolbar-left">
            <label class="switch" title="Keep the list across page reloads/navigations. Off by default, so navigating to a new page clears it — like DevTools' Preserve log.">
                <input type="checkbox" id="preserve-log">
                <span class="slider"></span>
            </label>
            <span class="toolbar-label" title="Keep the list across page reloads/navigations. Off by default, so navigating to a new page clears it — like DevTools' Preserve log.">Preserve log</span>

            <span class="toolbar-divider"></span>

            <label class="switch" title="Uncheck to show only the current tab's requests">
                <input type="checkbox" id="all-tabs-toggle" checked>
                <span class="slider"></span>
            </label>
            <span class="toolbar-label" title="Uncheck to show only the current tab's requests">All tabs</span>
        </div>
        <div class="toolbar-right">
            <span class="live-indicator" title="Watching for new requests in real time"><span class="live-dot"></span>Live</span>
            <button type="button" class="menu-btn clear-btn" id="clear-btn" disabled title="Clear all captured requests"><span class="btn-icon">&#128465;</span><span class="btn-label">Clear</span></button>
            <select id="export-format" class="filter-select" aria-label="Export format" title="Format used by the Export button">
                <option value="postman">Postman</option>
                <option value="har">HAR</option>
            </select>
            <button type="button" class="menu-btn" id="export-btn" disabled title="Export every request currently visible in the list below"><span class="btn-icon">&#11015;</span><span class="btn-label">Export</span></button>
            <select id="copy-format" class="filter-select" aria-label="Copy format" title="Format used by the per-row Copy buttons and Copy All">
                <option value="curl">curl</option>
                <option value="fetch">fetch</option>
            </select>
            <button type="button" class="copy-all-btn" id="copy-all-btn" disabled title="Copy a command for every request currently visible in the list below"><span class="btn-icon">&#128203;</span><span class="btn-label">Copy All Curl</span></button>
            <span class="request-count" id="request-count" title="Completed requests · pending ones are still waiting for a response">0 requests</span>
        </div>
    </div>

    <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search by URL or body..." aria-label="Search by URL or body">
        <select id="method-filter" class="filter-select" aria-label="Filter by method" title="Filter by HTTP method">
            <option value="">All Methods</option>
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
            <option value="HEAD">HEAD</option>
        </select>
        <select id="status-filter" class="filter-select" aria-label="Filter by status" title="Filter by response status">
            <option value="">All Status</option>
            <option value="2xx">2xx</option>
            <option value="3xx">3xx</option>
            <option value="4xx">4xx</option>
            <option value="5xx">5xx</option>
            <option value="pending">Pending</option>
            <option value="failed">Failed</option>
        </select>
    </div>

    <div class="table-wrap" id="table-wrap">
        <table class="result-table" id="table-result-detector-apis">
            <thead>
            <tr>
                <th class="col-curl" title="Copy this request (curl/fetch — see the format selector in the toolbar)">Copy</th>
                <th class="col-url sortable" data-sort-column="url" title="Click a row to see its full request/response headers and body. Click here to sort by URL.">URL<span class="sort-indicator"></span></th>
                <th class="col-status sortable" data-sort-column="status" title="HTTP method and response status code. Click to sort.">Status<span class="sort-indicator"></span></th>
                <th class="col-time sortable" data-sort-column="time" title="Time from request start to response/failure. Click to sort.">Time<span class="sort-indicator"></span></th>
                <th class="col-size sortable" data-sort-column="size" title="Response body size. Click to sort.">Size<span class="sort-indicator"></span></th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <div class="empty-state" id="empty-state">
            <span class="empty-state-icon">📡</span>
            <span class="empty-state-text">No API requests detected yet.</span>
        </div>
    </div>

    <footer class="app-footer">
        <div class="footer-meta">
            <span class="footer-copyright">© 2026 Detector APIs Extension</span>
            <span class="footer-dot">&middot;</span>
            <a class="footer-email-link" href="mailto:nguyenvantuan2391996@gmail.com">nguyenvantuan2391996@gmail.com</a>
            <span class="footer-dot">&middot;</span>
            <a class="footer-email-link" href="#" id="options-link">⚙ Options</a>
        </div>
        <div class="footer-contact">
            <span class="footer-contact-label">Feedback or found a bug?</span>
            <div class="footer-socials">
                <a class="footer-social-link" href="mailto:nguyenvantuan2391996@gmail.com" aria-label="Email" title="Email">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M2 4h20v16H2V4zm2 2.24V6l8 5.99L20 6v.24l-8 6-8-6zM20 18V8.51l-8 6-8-6V18h16z"/></svg>
                </a>
                <a class="footer-social-link" href="https://www.linkedin.com/in/tuan-nguyen-van-555315156" target="_blank" aria-label="LinkedIn" title="LinkedIn">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.5V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
                </a>
                <a class="footer-social-link" href="https://www.facebook.com/tuanelnino9/" target="_blank" aria-label="Facebook" title="Facebook">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>
                </a>
            </div>
        </div>
    </footer>
</div>

</body>
</html>

<script src="../js/constants.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/popup.js"></script>
