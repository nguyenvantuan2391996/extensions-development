<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Vua</title>
    <link rel="stylesheet" href="../css/game.css">
</head>
<body>
    <div class="bg-glow"></div>

    <button type="button" class="back-link" id="btn-close">&larr; Đóng</button>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip" id="mode-chip">Chế độ: <span id="hud-mode">2 người</span></div>
            <div class="hud-chip" id="turn-chip">Lượt: <span id="hud-turn">Trắng</span></div>
            <div class="hud-chip" id="thinking-chip" hidden>AI đang suy nghĩ...</div>
            <button type="button" class="reset-btn" id="btn-restart">Chơi lại</button>
        </div>

        <div class="canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <div class="overlay" id="overlay" hidden>
                <div class="overlay__inner">
                    <div class="overlay__title" id="overlay-title">Kết thúc</div>
                    <div class="overlay__desc" id="overlay-desc"></div>
                    <button type="button" class="overlay__btn" id="overlay-btn">Chơi lại</button>
                    <a class="coffee-badge" href="https://paypal.me/Newslette247" target="_blank" rel="noopener">
                        <span class="emoji">☕</span> Thích ván này? Mời tôi cà phê
                    </a>
                </div>
            </div>
        </div>
    </div>
